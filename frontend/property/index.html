<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Tints mobile browser chrome to match the app surface instead of black. -->
    <meta name="theme-color" content="#121412" />
    <title>Black Creek Hunt</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="/static/shared/base.css" />
    <link rel="stylesheet" href="/static/property/property.css" />
  </head>
  <body>
    <header class="top-bar">
      <a class="brand-home-link" href="/" aria-label="Back to all properties">
        <img
          class="brand-logo"
          src="/static/assets/black-creek-hunt-logo.png"
          alt="Black Creek Hunt"
          width="2172"
          height="724"
        />
      </a>
      <p
        id="live-counter"
        class="live-counter"
        data-active="false"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="live-indicator" aria-hidden="true"></span>
        <strong id="live-count-value">—</strong>
        <span id="live-count-label">Loading…</span>
      </p>
    </header>

    <!-- Filled by property.js whenever someone has been out past the overdue
         mark. Not a live region itself: the hours climb every few minutes, and
         a screen reader would read the whole banner out each time. -->
    <div id="overdue-banner" class="overdue-banner" hidden></div>

    <!-- Announces only that someone new is overdue. Assertive because this is
         the one message worth interrupting for. -->
    <p
      id="overdue-announcer"
      class="visually-hidden"
      role="alert"
      aria-live="assertive"
    ></p>

    <main>
      <div id="map" aria-label="Interactive map of hunting stands"></div>
      <p id="app-message" role="status" aria-live="polite">Loading map…</p>
      <p id="page-zoom-hint" role="status" aria-live="polite" hidden>
        Page zoomed — pinch out to return to the map
      </p>

      <div class="legend" aria-label="Stand status legend">
        <span><i style="--marker-color: var(--open)"></i>Open</span>
        <span><i style="--marker-color: var(--active)"></i>Active</span>
        <span><i style="--marker-color: var(--overdue)"></i>Overdue</span>
      </div>
    </main>

    <aside id="panel" aria-labelledby="panel-name" aria-hidden="true" inert>
      <div class="panel-header">
        <h2 id="panel-name" tabindex="-1"></h2>
        <button id="panel-close" type="button" aria-label="Close stand panel">
          Close
        </button>
      </div>

      <div id="panel-status"></div>

      <form id="check-in-form" novalidate hidden>
        <fieldset>
          <legend>Check in</legend>
          <p class="form-help">
            Add up to two guests. People may share a stand when it has enough
            available seats.
          </p>
          <div id="guest-fields"></div>
          <div class="form-actions">
            <button id="add-guest" type="button">Add guest</button>
            <button class="primary-action" type="submit">Check in</button>
          </div>
        </fieldset>
      </form>

      <button id="check-out-button" type="button" hidden>Check out</button>
      <p id="panel-message" role="status" aria-live="polite"></p>
    </aside>

    <script src="/static/property/property.js"></script>
  </body>
</html>
