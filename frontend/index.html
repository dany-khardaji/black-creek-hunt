<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Black Creek Hunt</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <h1>Black Creek Hunt</h1>
      <p
        id="live-counter"
        class="live-counter"
        data-active="false"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="live-indicator" aria-hidden="true"></span>
        <strong id="live-count-value">—</strong>
        <span id="live-count-label">Loading…</span>
      </p>
    </header>

    <main>
      <div id="map" aria-label="Interactive map of hunting stands"></div>
      <p id="app-message" role="status" aria-live="polite">Loading map…</p>

      <div class="legend" aria-label="Stand status legend">
        <span><i style="--marker-color: var(--open)"></i>Open</span>
        <span><i style="--marker-color: var(--active)"></i>Active</span>
        <span><i style="--marker-color: var(--overdue)"></i>Overdue</span>
      </div>
    </main>

    <aside id="panel" aria-labelledby="panel-name" aria-hidden="true">
      <div class="panel-header">
        <h2 id="panel-name" tabindex="-1"></h2>
        <button id="panel-close" type="button" aria-label="Close stand panel">
          Close
        </button>
      </div>

      <div id="panel-status"></div>

      <form id="check-in-form" novalidate hidden>
        <fieldset>
          <legend>Check in</legend>
          <p class="form-help">
            Add up to two guests. People may share a stand when it has enough
            available seats.
          </p>
          <div id="guest-fields"></div>
          <div class="form-actions">
            <button id="add-guest" type="button">Add guest</button>
            <button class="primary-action" type="submit">Check in</button>
          </div>
        </fieldset>
      </form>

      <button id="check-out-button" type="button" hidden>Check out</button>
      <p id="panel-message" role="status" aria-live="polite"></p>
    </aside>

    <script src="./app.js"></script>
  </body>
</html>
