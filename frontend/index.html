<!doctype html>
<html>
  <head>
    <title>Black Creek Hunt</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      #map {
        height: 100vh;
      }
      #panel {
        position: absolute;
        top: 0;
        right: 0;
        width: 300px;
        height: 100vh;
        background: white;
        z-index: 1000;
        padding: 16px;
        display: none;
      }
      #panel.open {
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Stands</h1>
    <div id="map"></div>
    <div id="live-count"></div>

    <!-- content filled in dynamically by openPanel() -->
    <div id="panel">
      <button id="panel-close">Close</button>
      <h2 id="panel-name"></h2>
      <div id="panel-status"></div>
    </div>

    <script>
      const API_URL = "http://localhost:8000";

      const map = L.map("map");
      map.setView([35.645, -78.442], 15);
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Esri", maxZoom: 19 },
      ).addTo(map);

      async function loadStands() {
        const response = await fetch(`${API_URL}/api/map-state`);
        const data = await response.json();

        document.getElementById("live-count").textContent =
          `${data.live_count} hunters on the property`;

        for (const stand of data.stands) {
          const marker = L.marker([stand.lat, stand.lng]).addTo(map);
          marker.on("click", () => openPanel(stand));
        }

        // reopen panel on load if the URL already has a stand selected
        const params = new URLSearchParams(location.search);
        const standId = params.get("stand");
        const stand = data.stands.find((s) => s.id === standId);

        if (stand) {
          openPanel(stand);
        }
      }

      async function loadMapFeatures() {
        const response = await fetch(`${API_URL}/api/map-features`);
        const data = await response.json();

        for (const feature of data) {
          L.circleMarker([feature.lat, feature.lng], {
            radius: 6,
            color: "white",
            weight: 2,
            fillColor: "black",
            fillOpacity: 1,
          }).addTo(map);
        }
      }

      function openPanel(stand) {
        document.getElementById("panel-name").textContent = stand.name;

        const statusDiv = document.getElementById("panel-status");

        if (stand.status === "open") {
          statusDiv.innerHTML = "<button>Check In</button>";

          // rebuilt every time, so re-find and re-attach each time
          const checkInButton = statusDiv.querySelector("button");

          checkInButton.addEventListener("click", async () => {
            const response = await fetch(`${API_URL}/api/hunts`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ stand_id: stand.id, guests: [] }),
            });

            if (response.ok) {
              closePanel();
              loadStands(); // no auto-refresh, must reload manually
            }
          });
        } else {
          statusDiv.innerHTML = `Occupied by ${stand.occupied_by}`;
        }

        document.getElementById("panel").classList.add("open");
        history.pushState({}, "", `?stand=${stand.id}`);
      }

      function closePanel() {
        document.getElementById("panel").classList.remove("open");
      }

      document
        .getElementById("panel-close")
        .addEventListener("click", closePanel);

      loadStands();
      loadMapFeatures();
    </script>
  </body>
</html>
