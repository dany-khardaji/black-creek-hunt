<!doctype html>
<html>
  <head>
    <title>Black Creek Hunt</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      #map {
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <h1>Stands</h1>
    <div id="map"></div>
    <script>
      const map = L.map("map");
      map.setView([35.645, -78.442], 15);

      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Esri", maxZoom: 19 },
      ).addTo(map);

      async function loadStands() {
        const response = await fetch("http://127.0.0.1:8000/api/stands");
        const data = await response.json();

        for (const stand of data) {
          L.marker([stand.lat, stand.lng]).addTo(map);
        }
      }

      async function loadMapFeatures() {
        const response = await fetch("http://127.0.0.1:8000/api/map-features");
        const data = await response.json();

        for (const feature of data) {
          L.circleMarker([feature.lat, feature.lng], {
            radius: 6,
            color: "white",
            weight: 2,
            fillColor: "black",
            fillOpacity: 1,
          }).addTo(map);
        }
      }

      loadStands();
      loadMapFeatures();
    </script>
  </body>
</html>
