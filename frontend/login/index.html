<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Tints mobile browser chrome to match the app surface instead of black. -->
    <meta name="theme-color" content="#121412" />
    <title>Sign in · Black Creek Hunt</title>
    <link rel="stylesheet" href="/static/shared/base.css" />
    <link rel="stylesheet" href="/static/login/login.css" />
  </head>
  <body>
    <main class="login-main">
      <div class="login-card">
        <img
          class="login-logo"
          src="/static/assets/black-creek-hunt-logo.png"
          alt="Black Creek Hunt"
          width="2172"
          height="724"
        />

        <p class="login-intro">Members only.</p>

        <!-- Server-side OAuth: a plain link, no JavaScript library required.
             The endpoint is added in Slice 4. -->
        <a class="google-button" href="/api/auth/google/login">
          <svg
            class="google-mark"
            viewBox="0 0 18 18"
            width="18"
            height="18"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"
            />
            <path
              fill="#FBBC05"
              d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"
            />
            <path
              fill="#EA4335"
              d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"
            />
          </svg>
          Continue with Google
        </a>

        <p class="login-divider"><span>or</span></p>

        <form id="password-form" class="password-form" novalidate>
          <label for="login-email">
            Email
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </label>

          <label for="login-password">
            Password
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>

          <button class="primary-action" type="submit">Sign in</button>
        </form>

        <p id="login-message" role="status" aria-live="polite"></p>
      </div>
    </main>

    <script src="/static/login/login.js"></script>
  </body>
</html>
