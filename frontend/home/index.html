<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Tints mobile browser chrome to match the app surface instead of black. -->
    <meta name="theme-color" content="#121412" />
    <title>Black Creek Hunt</title>
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <header class="home-bar">
      <img
        class="brand-logo"
        src="../assets/black-creek-hunt-logo.png"
        alt="Black Creek Hunt"
        width="2172"
        height="724"
      />
      <p
        id="live-counter"
        class="live-counter"
        data-active="false"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <span class="live-indicator" aria-hidden="true"></span>
        <strong id="live-count-value">—</strong>
        <span id="live-count-label">Loading…</span>
      </p>
    </header>

    <main class="home-main">
      <h1 class="home-heading">Properties</h1>
      <p id="home-message" role="status" aria-live="polite">Loading properties…</p>

      <!-- Cards are rendered by home.js from GET /api/properties. -->
      <ul id="property-list" class="property-list"></ul>
    </main>

    <script src="./home.js"></script>
  </body>
</html>
